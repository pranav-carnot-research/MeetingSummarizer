version: '3.8'

services:
  # Meeting Summarizer API & React UI
  api:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - meeting_data:/app/job_results
      - /home/gcpuser/.cache:/root/.cache
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
      - WORKERS=4
      - LLM_PROVIDER=groq
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  meeting_data:
    driver: local
